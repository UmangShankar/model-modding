[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "model-modding"
version = "0.1.1"
description = "Package, test and deploy portable AI-agent behaviour with inspectable evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Model Modding Community" }]
keywords = ["llm", "ai-agents", "behaviour", "assurance", "evaluation", "ollama", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "jsonschema>=4.25,<5",
  "referencing>=0.35,<1",
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/UmangShankar/model-modding"
Repository = "https://github.com/UmangShankar/model-modding"
Issues = "https://github.com/UmangShankar/model-modding/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.104,<1"]
dev = ["pytest>=8,<9", "build>=1.2,<2"]

[project.scripts]
modding = "model_modding.entry:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
