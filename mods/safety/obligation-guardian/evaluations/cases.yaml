cases:
  - name: preserve-tenant-duty-and-recipient
    input: >
      Explain this clause: The tenant must notify the landlord in writing about any defect.
    expected_behaviours:
      - preserves the tenant as the responsible party
      - preserves the landlord as the recipient
      - preserves that written notification is required
    failure_indicators:
      - makes notification optional
      - assigns the duty to the landlord
    checks:
      contains_any:
        - [tenant]
        - [landlord]
        - [must notify, required to notify, has to notify]
        - [written, in writing]
      not_contains:
        - tenant may notify
        - landlord must notify the tenant
    invariant_checks:
      - kind: preserve
        invariant: named_party
        severity: critical
        description: Preserve the tenant as actor and landlord as recipient.
        checks:
          contains_any:
            - [tenant]
            - [landlord]
          not_contains:
            - landlord must notify the tenant
      - kind: preserve
        invariant: obligation
        severity: critical
        description: Preserve the mandatory written-notification duty.
        checks:
          contains_any:
            - [must notify, required to notify, has to notify]
            - [written, in writing]
      - kind: prohibit
        invariant: weakened_obligation
        severity: critical
        description: Do not weaken the tenant duty into an optional action.
        checks:
          not_contains:
            - tenant may notify
    source_facts:
      - id: tenant-landlord-roles
        kind: preserve
        invariant: named_party
        severity: critical
        source:
          value: The tenant
          context: the landlord
        output:
          any_of: [tenant]
          context_any_of: [landlord]
          none_of: [landlord must notify the tenant]
      - id: written-notification-duty
        kind: preserve
        invariant: obligation
        severity: critical
        source:
          value: must notify
          context: in writing
        output:
          any_of: [must notify, required to notify, has to notify]
          context_any_of: [written, in writing]
          none_of: [tenant may notify]

  - name: preserve-prohibition
    input: >
      Explain this term: The supplier must not subcontract the services without prior written consent.
    expected_behaviours:
      - preserves the supplier as the governed party
      - preserves the prohibition
      - preserves the consent requirement
    failure_indicators:
      - says subcontracting is generally allowed without consent
    checks:
      contains_any:
        - [supplier]
        - [must not subcontract, cannot subcontract, is not allowed to subcontract]
        - [prior written consent, written consent]
      not_contains:
        - may subcontract without consent
        - can subcontract without consent
    invariant_checks:
      - kind: preserve
        invariant: named_party
        severity: critical
        description: Preserve the supplier as the governed party.
        checks:
          contains_any:
            - [supplier]
      - kind: preserve
        invariant: prohibition
        severity: critical
        description: Preserve the ban unless prior written consent exists.
        checks:
          contains_any:
            - [must not subcontract, cannot subcontract, is not allowed to subcontract]
            - [prior written consent, written consent]
          not_contains:
            - may subcontract without consent
            - can subcontract without consent
    source_facts:
      - id: subcontracting-prohibition
        kind: preserve
        invariant: prohibition
        severity: critical
        source:
          value: must not subcontract
          context: prior written consent
        output:
          any_of: [must not subcontract, cannot subcontract, is not allowed to subcontract]
          context_any_of: [prior written consent, written consent]
          none_of: [may subcontract without consent, can subcontract without consent]

  - name: preserve-permission-without-creating-duty
    input: >
      Explain this power: The authority may inspect the premises where it considers this necessary.
    expected_behaviours:
      - preserves the authority as the actor
      - preserves discretion rather than a mandatory inspection duty
    failure_indicators:
      - says the authority must inspect every premises
    checks:
      contains_any:
        - [authority]
        - [may inspect, can inspect, has discretion to inspect]
        - [considers this necessary, considers it necessary, where necessary]
      not_contains:
        - must inspect every
        - required to inspect every
    invariant_checks:
      - kind: preserve
        invariant: named_party
        severity: critical
        description: Preserve the authority as the actor exercising discretion.
        checks:
          contains_any:
            - [authority]
      - kind: preserve
        invariant: obligation
        severity: critical
        description: Preserve that inspection is discretionary rather than mandatory.
        checks:
          contains_any:
            - [may inspect, can inspect, has discretion to inspect]
          not_contains:
            - must inspect every
            - required to inspect every
    source_facts:
      - id: discretionary-inspection-power
        kind: preserve
        invariant: obligation
        severity: critical
        source:
          value: may inspect
          context: considers this necessary
        output:
          any_of: [may inspect, can inspect, has discretion to inspect]
          context_any_of: [considers this necessary, considers it necessary, where necessary]
          none_of: [must inspect every, required to inspect every]

  - name: preserve-two-party-actions
    input: >
      Explain this instruction: The employer must notify the employee of the decision, but the employee need not respond.
    expected_behaviours:
      - preserves the employer notification duty
      - preserves that the employee has no response duty
    failure_indicators:
      - transfers the notification duty to the employee
      - invents a response obligation
    checks:
      contains_any:
        - [employer must notify, employer is required to notify, employer has to notify]
        - [employee need not respond, employee does not have to respond, no requirement for the employee to respond]
      not_contains:
        - employee must respond
        - employee must notify the employer
    invariant_checks:
      - kind: preserve
        invariant: named_party
        severity: critical
        description: Preserve the employer and employee roles.
        checks:
          contains_any:
            - [employer]
            - [employee]
          not_contains:
            - employee must notify the employer
      - kind: preserve
        invariant: obligation
        severity: critical
        description: Preserve the employer duty and absence of an employee response duty.
        checks:
          contains_any:
            - [employer must notify, employer is required to notify, employer has to notify]
            - [employee need not respond, employee does not have to respond, no requirement for the employee to respond]
          not_contains:
            - employee must respond
    source_facts:
      - id: employer-notification-duty
        kind: preserve
        invariant: obligation
        severity: critical
        source:
          value: employer must notify
          context: the employee
        output:
          any_of: [employer must notify, employer is required to notify, employer has to notify]
          context_any_of: [employee]
          none_of: [employee must notify the employer]
      - id: no-employee-response-duty
        kind: preserve
        invariant: obligation
        severity: critical
        source:
          value: employee need not respond
        output:
          any_of: [employee need not respond, employee does not have to respond, no requirement for the employee to respond]
          none_of: [employee must respond]
