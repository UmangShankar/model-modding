<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Fitment Matrix</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f5;color:#171717}.wrap{max-width:1100px;margin:auto;padding:32px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:24px;margin-bottom:20px}h1{margin:0 0 8px}input{display:block;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.metric{font-size:28px;font-weight:700}.muted{color:#666}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd}.good{font-weight:700}.warn{font-weight:700}.bar{height:10px;background:#eee;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:currentColor}.empty{padding:50px;text-align:center;color:#666}
</style>
</head>
<body><main class="wrap">
<div class="card"><h1>Model Fitment Matrix</h1><p class="muted">Load a <code>benchmark.json</code> generated by <code>modding benchmark</code>. The file stays in your browser.</p><input id="file" type="file" accept="application/json"></div>
<div id="app" class="card empty">No benchmark loaded.</div>
</main>
<script>
const app=document.getElementById('app');
document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{render(JSON.parse(await f.text()))}catch(err){app.className='card empty';app.textContent='Could not read benchmark: '+err.message}});
function pct(v){return (v*100).toFixed(0)+'%'}
function render(data){const completed=data.models.filter(m=>m.status==='completed');const best=[...completed].sort((a,b)=>b.summary.modded_pass_rate-a.summary.modded_pass_rate)[0];app.className='card';app.innerHTML=`<h2>${data.recipe_display_name}</h2><div class="grid"><div><div class="metric">${completed.length}/${data.models.length}</div><div class="muted">models completed</div></div><div><div class="metric">${data.case_count}</div><div class="muted">cases per model</div></div><div><div class="metric">${best?best.model:'—'}</div><div class="muted">highest modded pass rate</div></div></div><h3>Fitment</h3><table><thead><tr><th>Model</th><th>Status</th><th>Stock</th><th>Modded</th><th>Change</th><th>Regressions</th><th>Latency</th></tr></thead><tbody>${data.models.map(row=>row.status!=='completed'?`<tr><td>${row.model}</td><td class="warn">${row.status}</td><td colspan="5">${row.reason||'Unavailable'}</td></tr>`:`<tr><td><strong>${row.model}</strong></td><td class="good">completed</td><td>${pct(row.summary.stock_pass_rate)}</td><td>${pct(row.summary.modded_pass_rate)}<div class="bar"><span style="width:${pct(row.summary.modded_pass_rate)}"></span></div></td><td>${row.summary.improvement_points>=0?'+':''}${row.summary.improvement_points.toFixed(1)} pp</td><td>${row.summary.regressions}</td><td>${row.summary.average_latency_seconds.toFixed(2)}s</td></tr>`).join('')}</tbody></table><p class="muted">This matrix shows deterministic fitment evidence, not universal model quality. Review responses and human-review criteria before changing compatibility claims.</p>`}
</script></body></html>
