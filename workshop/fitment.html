<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Fitment Matrix</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f5;color:#171717}.wrap{max-width:1100px;margin:auto;padding:32px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:24px;margin-bottom:20px}h1{margin:0 0 8px}input{display:block;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.metric{font-size:28px;font-weight:700}.muted{color:#666}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd}.good{font-weight:700}.warn{font-weight:700}.bar{height:10px;background:#eee;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:currentColor}.empty{padding:50px;text-align:center;color:#666}
</style>
</head>
<body><main class="wrap">
<div class="card"><h1>Model Fitment Matrix</h1><p class="muted">Load a <code>benchmark.json</code> generated by <code>modding benchmark</code>. The file stays in your browser.</p><input id="file" type="file" accept="application/json"></div>
<div id="app" class="card empty">No benchmark loaded.</div>
</main>
<script>
const app=document.getElementById('app');
document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{render(JSON.parse(await f.text()))}catch(err){app.className='card empty';app.textContent='Could not read benchmark: '+err.message}});
function pct(v){const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,n*100)).toFixed(0)+'%':'0%'}
function el(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=String(text);if(className)node.className=className;return node}
function metric(value,label){const box=document.createElement('div');box.append(el('div',value,'metric'),el('div',label,'muted'));return box}
function cell(row,value,className,colSpan){const td=el('td',value,className);if(colSpan)td.colSpan=colSpan;row.append(td);return td}
function render(data){
  const models=Array.isArray(data.models)?data.models:[];
  const completed=models.filter(m=>m&&m.status==='completed'&&m.summary);
  const best=[...completed].sort((a,b)=>Number(b.summary.modded_pass_rate||0)-Number(a.summary.modded_pass_rate||0))[0];
  app.className='card';
  app.replaceChildren();
  app.append(el('h2',data.recipe_display_name||'Benchmark'));
  const grid=el('div',undefined,'grid');
  grid.append(metric(`${completed.length}/${models.length}`,'models completed'));
  grid.append(metric(Number.isFinite(Number(data.case_count))?Number(data.case_count):0,'cases per model'));
  grid.append(metric(best?(best.resolved_model||best.model||'—'):'—','highest modded pass rate'));
  app.append(grid,el('h3','Fitment'));
  const table=document.createElement('table');
  const thead=document.createElement('thead');
  const header=document.createElement('tr');
  ['Model','Status','Stock','Modded','Change','Regressions','Latency'].forEach(label=>header.append(el('th',label)));
  thead.append(header);
  const tbody=document.createElement('tbody');
  models.forEach(item=>{
    const row=document.createElement('tr');
    const modelName=item&&(item.resolved_model||item.model)||'Unknown';
    if(!item||item.status!=='completed'||!item.summary){
      cell(row,modelName);
      cell(row,item&&item.status||'unavailable','warn');
      cell(row,item&&item.reason||'Unavailable',undefined,5);
    }else{
      const summary=item.summary;
      const modelCell=document.createElement('td');
      modelCell.append(el('strong',modelName));
      row.append(modelCell);
      cell(row,'completed','good');
      cell(row,pct(summary.stock_pass_rate));
      const moddedCell=cell(row,pct(summary.modded_pass_rate));
      const bar=el('div',undefined,'bar');
      const span=document.createElement('span');
      span.style.width=pct(summary.modded_pass_rate);
      bar.append(span);
      moddedCell.append(bar);
      const improvement=Number(summary.improvement_points||0);
      cell(row,`${improvement>=0?'+':''}${improvement.toFixed(1)} pp`);
      cell(row,Number(summary.regressions||0));
      cell(row,`${Number(summary.average_latency_seconds||0).toFixed(2)}s`);
    }
    tbody.append(row);
  });
  table.append(thead,tbody);
  app.append(table,el('p','This matrix shows deterministic fitment evidence, not universal model quality. Review responses and human-review criteria before changing compatibility claims.','muted'));
}
</script></body></html>
