name: Evidence PR summary

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  evidence-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Generate synthetic contract evidence
        run: python scripts/generate_ci_evidence.py --output build/ci-evidence

      - name: Publish job summary
        run: cat build/ci-evidence/pr-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence pipeline artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-contract-${{ github.event.pull_request.number }}
          path: build/ci-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Create or update pull request summary
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- model-modding-evidence-summary -->';
            const body = fs.readFileSync('build/ci-evidence/pr-summary.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
