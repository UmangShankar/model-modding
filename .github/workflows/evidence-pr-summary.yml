name: Evidence PR summary

on:
  pull_request:

permissions:
  contents: read

jobs:
  evidence-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Generate synthetic contract evidence
        run: python scripts/generate_ci_evidence.py --output build/ci-evidence

      - name: Publish job summary
        run: cat build/ci-evidence/pr-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence pipeline artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-contract-${{ github.event.pull_request.number }}
          path: build/ci-evidence
          if-no-files-found: error
          retention-days: 14
