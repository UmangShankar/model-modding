name: Validate and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate release readiness
        run: |
          modding validate
          modding doctor

      - name: Run automated tests
        run: pytest

      - name: Build distributions
        run: python -m build

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/model-modding-wheel
          /tmp/model-modding-wheel/bin/python -m pip install dist/*.whl
          /tmp/model-modding-wheel/bin/modding --help
          /tmp/model-modding-wheel/bin/modding doctor --root .
