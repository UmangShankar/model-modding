name: Validate and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate release readiness
        run: |
          modding validate
          modding doctor

      - name: Verify reproducible flagship build
        run: |
          modding build trusted-document-explainer --output /tmp/model-modding-build
          modding verify-build trusted-document-explainer --build-directory /tmp/model-modding-build

      - name: Test evidence privacy and separation
        run: pytest tests/test_evidence_bundles.py::test_bundle_preserves_raw_response_but_omits_prompt_text

      - name: Test evidence determinism
        run: pytest tests/test_evidence_bundles.py::test_fixed_context_bundles_are_byte_identical

      - name: Test evidence tamper detection
        run: pytest tests/test_evidence_bundles.py::test_tampered_raw_response_fails_verification

      - name: Test evidence command integration
        run: pytest tests/test_evidence_bundles.py::test_provider_run_can_emit_and_verify_evidence

      - name: Test evidence comparison gates
        run: |
          pytest tests/test_evidence_comparison.py::test_equal_verified_evidence_passes_comparison
          pytest tests/test_evidence_comparison.py::test_new_critical_failure_blocks_comparison_command
          pytest tests/test_evidence_comparison.py::test_severity_escalation_blocks_at_candidate_severity
          pytest tests/test_evidence_comparison.py::test_fixture_or_evaluator_mismatch_is_not_comparable

      - name: Test compatibility matrices
        run: |
          pytest tests/test_evidence_comparison.py::test_matrix_reports_each_provider_model_by_invariant
          pytest tests/test_evidence_comparison.py::test_matrix_command_writes_json_and_markdown

      - name: Test repeated evidence aggregation
        run: pytest tests/test_release_pipeline.py::test_repeated_evidence_aggregate_requires_repetitions_and_zero_critical

      - name: Test reviewed baseline activation
        run: pytest tests/test_release_pipeline.py::test_baseline_activation_preserves_verified_bundle

      - name: Test release bundle integrity
        run: pytest tests/test_release_pipeline.py::test_release_bundle_requires_actual_cases_and_exact_returned_model

      - name: Test three-provider release readiness
        run: pytest tests/test_release_pipeline.py::test_release_readiness_requires_three_providers_three_runs_and_full_cases

      - name: Test summaries and protected run plans
        run: pytest tests/test_release_pipeline.py::test_summary_and_protected_run_plan_are_explicit

      - name: Exercise complete synthetic CI evidence pipeline
        run: python scripts/generate_ci_evidence.py --output /tmp/model-modding-ci-evidence

      - name: Exercise strict release-candidate assembly
        run: |
          python scripts/assemble_release_evidence.py \
            --evidence-root /tmp/model-modding-ci-evidence/runs \
            --output /tmp/model-modding-ci-release \
            --minimum-repetitions 3 \
            --minimum-cases 40

      - name: Test positioning contracts
        run: pytest tests/test_positioning.py

      - name: Run behavioural regression tests
        run: pytest --ignore=tests/test_evidence_bundles.py --ignore=tests/test_evidence_comparison.py --ignore=tests/test_release_pipeline.py --ignore=tests/test_positioning.py

      - name: Build distributions
        run: python -m build

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/model-modding-wheel
          /tmp/model-modding-wheel/bin/python -m pip install dist/*.whl
          /tmp/model-modding-wheel/bin/modding --help
          /tmp/model-modding-wheel/bin/modding doctor --root .
          /tmp/model-modding-wheel/bin/modding build trusted-document-explainer --root . --output /tmp/model-modding-wheel-build
          /tmp/model-modding-wheel/bin/modding verify-build trusted-document-explainer --root . --build-directory /tmp/model-modding-wheel-build
          /tmp/model-modding-wheel/bin/modding verify-evidence --help
          /tmp/model-modding-wheel/bin/modding compare-evidence --help
          /tmp/model-modding-wheel/bin/modding matrix-evidence --help
          /tmp/model-modding-wheel/bin/modding aggregate-evidence --help
          /tmp/model-modding-wheel/bin/modding activate-baseline --help
          /tmp/model-modding-wheel/bin/modding release-check --help
          /tmp/model-modding-wheel/bin/modding evidence-summary --help
          /tmp/model-modding-wheel/bin/modding validate-provider-run --help
