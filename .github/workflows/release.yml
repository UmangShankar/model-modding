name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Install and test source package
        run: |
          python -m pip install -e ".[dev]"
          modding validate
          modding doctor
          pytest

      - name: Build distributions
        run: python -m build

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/model-modding-release
          /tmp/model-modding-release/bin/python -m pip install dist/*.whl
          /tmp/model-modding-release/bin/modding --help
          /tmp/model-modding-release/bin/modding doctor --root .

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: model-modding-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
