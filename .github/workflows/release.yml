name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Install and test source package
        run: |
          python -m pip install -e ".[dev]"
          modding validate
          modding doctor
          pytest

      - name: Verify tag and package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PACKAGE_VERSION=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )
          if [ "v$PACKAGE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Enforce v0.2 reviewed evidence gate
        if: startsWith(github.ref, 'refs/tags/v0.2')
        run: |
          python scripts/assemble_release_evidence.py \
            --evidence-root evidence/release-candidate \
            --output build/release-candidate \
            --minimum-repetitions 3 \
            --minimum-cases 40
          cat build/release-candidate/release-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build distributions
        run: python -m build

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/model-modding-release
          /tmp/model-modding-release/bin/python -m pip install dist/*.whl
          /tmp/model-modding-release/bin/modding --help
          /tmp/model-modding-release/bin/modding doctor --root .
          /tmp/model-modding-release/bin/modding aggregate-evidence --help
          /tmp/model-modding-release/bin/modding release-check --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: model-modding-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
