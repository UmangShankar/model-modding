name: Protected provider evidence

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Cloud provider
        required: true
        type: choice
        options:
          - anthropic
          - openai
      model:
        description: Exact allowlisted model ID
        required: true
        type: string
      repetitions:
        description: Number of complete 40-case repetitions
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      max_tokens:
        description: Maximum output tokens per response
        required: true
        default: "512"
        type: choice
        options:
          - "256"
          - "512"
          - "1024"

permissions:
  contents: read

concurrency:
  group: provider-evidence-${{ inputs.provider }}-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: provider-evidence
    timeout-minutes: 120
    env:
      MODEL_MODDING_ALLOWED_MODELS: ${{ vars.MODEL_MODDING_ALLOWED_MODELS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and provider SDKs
        run: python -m pip install -e ".[anthropic,openai]"

      - name: Validate protected run plan
        run: |
          modding validate-provider-run \
            --provider "${{ inputs.provider }}" \
            --model "${{ inputs.model }}" \
            --repetitions "${{ inputs.repetitions }}" \
            --max-tokens "${{ inputs.max_tokens }}" \
            --case-limit 40

      - name: Create safe artifact identity
        shell: bash
        run: |
          SAFE_MODEL=$(printf '%s' "${{ inputs.model }}" | tr '/: ' '___')
          echo "SAFE_MODEL=$SAFE_MODEL" >> "$GITHUB_ENV"

      - name: Execute complete evidence repetitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/provider-evidence
          for repetition in $(seq 1 "${{ inputs.repetitions }}"); do
            evidence_directory="build/provider-evidence/runs/run-$repetition"
            modding evaluate trusted-document-explainer \
              --provider "${{ inputs.provider }}" \
              --model "${{ inputs.model }}" \
              --temperature 0 \
              --max-tokens "${{ inputs.max_tokens }}" \
              --fail-on none \
              --timeout 120 \
              --output "build/provider-evidence/reports/run-$repetition" \
              --evidence "$evidence_directory"
            modding verify-evidence "$evidence_directory"
            python - "$evidence_directory" <<'PY'
          from pathlib import Path
          import sys
          from scripts.assemble_release_evidence import validate_release_bundle
          validate_release_bundle(Path.cwd(), Path(sys.argv[1]), minimum_cases=40)
          PY
          done

      - name: Aggregate repeated evidence
        shell: bash
        run: |
          modding aggregate-evidence build/provider-evidence/runs/run-* \
            --minimum-repetitions "${{ inputs.repetitions }}" \
            --output build/provider-evidence/aggregate
          modding matrix-evidence build/provider-evidence/runs/run-1 \
            --output build/provider-evidence/matrix
          modding evidence-summary \
            --matrix build/provider-evidence/matrix/matrix.json \
            --aggregate build/provider-evidence/aggregate/aggregate.json \
            --output build/provider-evidence/provider-summary.md \
            --github-summary

      - name: Upload provider evidence
        uses: actions/upload-artifact@v4
        with:
          name: provider-evidence-${{ inputs.provider }}-${{ env.SAFE_MODEL }}-${{ github.run_id }}
          path: build/provider-evidence
          if-no-files-found: error
          retention-days: 30
